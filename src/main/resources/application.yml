server:
  port: 8081

spring:
  application:
    name: search-engine-mcp
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: search-engine-mcp
        version: 0.0.1
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >
          This server exposes two different concepts: data sources and saved
          query templates. Routing rule: requests about template, saved query,
          execution by template, or шаблон must start with
          listSavedQueryTemplates and must never use
          listSearchServiceSources. Use listSearchServiceSources only for
          requests about data-source inventory, databases, storages, or
          topology. To execute a template, find it, inspect its required
          parameters, start asynchronous execution, and fetch a limited result
          page. Do not invent template IDs or parameter keys.

search-service:
  base-url: ${SEARCH_SERVICE_BASE_URL:http://localhost:8080}
  time-zone: Europe/Moscow

mcp:
  security:
    enabled: ${MCP_SECURITY_ENABLED:true}
    issuer-uri: ${MCP_AUTH_ISSUER_URI:}
    audience: ${MCP_AUTH_AUDIENCE:search-engine-mcp}
    resource-uri: ${MCP_RESOURCE_URI:http://localhost:8081/mcp}
    metadata-uri: ${MCP_RESOURCE_METADATA_URI:http://localhost:8081/.well-known/oauth-protected-resource}
