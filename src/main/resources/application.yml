server:
  port: 8081

spring:
  application:
    name: search-engine-mcp
  ai:
    mcp:
      server:
        name: search-engine-mcp
        version: 0.0.1
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        instructions: >
          This server exposes search service topology sources and saved query
          templates. Find a template, inspect its required parameters, start
          asynchronous execution, check its status, and fetch a limited page of
          table rows. Do not invent template IDs or parameter keys.

search-service:
  base-url: http://localhost:8080
